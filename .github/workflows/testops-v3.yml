name: testops (demo)

on:
  workflow_dispatch:        # manual trigger + TestOps rerun entry point
    inputs:
      RELEASE:
        description: "Release under test"
        required: false
        default: "2026.08"
        type: choice
        options:
          - "2026.08"
          - "2026.07"
          - "2026.06"
      BROWSER:
        description: "Browser"
        required: false
        default: "electron"
        type: choice
        options:
          - electron
          - chrome
          - firefox
      OS:
        description: "Target platform (reported to TestOps)"
        required: false
        default: "Linux"
        type: choice
        options:
          - Linux
          - Windows
          - Android
      SUITE:
        description: "Which specs to run"
        required: false
        default: "regression"
        type: choice
        options:
          - regression      # full weekly scope: ~120 tests, 52 failures
          - stability       # the 4-test flaky/bug showcase
          - all
      ALLURE_JOB_RUN_ID:
        description: "ALLURE_JOB_RUN_ID service parameter. Leave blank."
        required: false
      ALLURE_USERNAME:
        description: "ALLURE_USERNAME service parameter. Leave blank."
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # ---- demo mechanics -------------------------------------------------
      CYPRESS_RUN_PARITY: ${{ github.run_number }}          # drives cross-launch flakiness
      CYPRESS_RELEASE: ${{ github.event.inputs.RELEASE }}   # -> Cypress.env('RELEASE') -> allure label

      # ---- TestOps connection (repo secrets) ------------------------------
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
      ALLURE_RESULTS: allure-results

      # ---- how the launch presents itself in TestOps ----------------------
      ALLURE_LAUNCH_NAME: "Regression ${{ github.event.inputs.RELEASE }} #${{ github.run_number }}"
      ALLURE_LAUNCH_TAGS: "cypress,demo,${{ github.event.inputs.RELEASE }}"
      ALLURE_JOB_PARAMETERS: "release=${{ github.event.inputs.RELEASE }},browser=${{ github.event.inputs.BROWSER }},os=${{ github.event.inputs.OS }},device=demo-stand"
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}   # rerun context from TestOps

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1

      - name: Resolve spec pattern
        id: spec
        run: |
          case "${{ github.event.inputs.SUITE }}" in
            stability)  echo "pattern=cypress/e2e/3-demo/demo-stability.cy.js" >> "$GITHUB_OUTPUT" ;;
            regression) echo "pattern=cypress/e2e/3-demo/demo-regression.cy.js" >> "$GITHUB_OUTPUT" ;;
            *)          echo "pattern=cypress/e2e/3-demo/*.cy.js" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run tests and stream to TestOps
        run: |
          allurectl watch -- npx start-test 8080 \
            "cypress run --browser ${{ github.event.inputs.BROWSER }} --spec '${{ steps.spec.outputs.pattern }}'"

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
