name: demo
# Прогон только демо-спеков (~480 тестов, кластеры падений, флаки).
# Kitchen-sink примеры не запускаются — прогон занимает около минуты.
on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "ALLURE_JOB_RUN_ID service parameter. Leave blank."
        required: false
      ALLURE_USERNAME:
        description: "ALLURE_USERNAME service parameter. Leave blank."
        required: false
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      CYPRESS_RUN_PARITY: ${{ github.run_number }}
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
      ALLURE_LAUNCH_NAME: "nightly regression"
      ALLURE_RESULTS: allure-results
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
      ALLURE_LAUNCH_TAGS: "cypress,nightly"
      ALLURE_JOB_PARAMETERS: "browser=Electron,os=Linux,env=staging"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1

      - name: Run demo specs and stream to TestOps
        run: allurectl watch -- npm run local:run:demo
